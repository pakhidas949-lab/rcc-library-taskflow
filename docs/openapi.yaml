openapi: 3.0.3
info:
  title: TaskFlow API
  version: 1.0.0
  description: |
    RESTful backend service for task management - the server-side engine behind
    the **TaskFlow Lite** client.

    ### Conventions
    * Every response is JSON.
    * Successful responses use a consistent envelope: `{ "success": true, "data": ... }`.
    * Errors use `{ "success": false, "error": { "message": string, "details": [] } }`.
    * Every response carries an `X-Request-Id` header that also appears in error bodies.
    * The same endpoints are available under `/api/tasks` and `/api/v1/tasks`.
  contact:
    name: TaskFlow
    url: https://example.com/taskflow
  license:
    name: MIT

servers:
  - url: http://localhost:5000
    description: Local development
  - url: https://api.taskflow.example.com
    description: Production

tags:
  - name: Health
    description: Service liveness probe
  - name: Auth
    description: Session management
  - name: Tasks
    description: CRUD operations for the task resource

paths:


  /api/auth/login:
    post:
      tags: [Auth]
      summary: Start a session
      description: |
        Verifies the staff credentials and issues an HttpOnly session cookie.
        After five failed attempts the account is locked for ten minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: priyanka }
                email: { type: string, example: p.das@rccit.edu }
                password: { type: string, format: password, example: rccit@2026 }
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: The HttpOnly session cookie.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Welcome back, Priyanka }
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      expiresAt: { type: string, format: date-time }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: End the session
      responses:
        '200':
          description: Signed out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Signed out }

  /api/auth/session:
    get:
      tags: [Auth]
      summary: Current session
      description: "Returns the signed-in librarian, or `authenticated: false`."
      responses:
        '200':
          description: The session state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      authenticated: { type: boolean, example: true }
                      user:
                        allOf:
                          - $ref: '#/components/schemas/User'
                        nullable: true
                      expiresAt: { type: string, format: date-time, nullable: true }

  /api/stats:
    get:
      tags: [Health]
      summary: Aggregate task counters
      description: |
        Dashboard KPIs. Tasks are grouped by their `[Namespace]` tag
        (e.g. `[Catalog] The Secret History`) so each page can show its own
        totals alongside the global ones.
      responses:
        '200':
          description: The counters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      total: { type: integer, example: 20 }
                      completed: { type: integer, example: 3 }
                      open: { type: integer, example: 17 }
                      byNamespace:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            total: { type: integer, example: 6 }
                            completed: { type: integer, example: 1 }
                            open: { type: integer, example: 5 }

  /api/health:
    get:
      tags: [Health]
      summary: Service health check
      description: Used by uptime monitors and the load-test harness.
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  status: { type: string, example: ok }
                  service: { type: string, example: taskflow-api }
                  uptime: { type: number, example: 128.42 }
                  timestamp: { type: string, format: date-time }

  /api/tasks:
    get:
      tags: [Tasks]
      summary: Get all tasks
      description: Returns every task, newest first. Supports optional filtering.
      parameters:
        - name: completed
          in: query
          description: Filter by completion state.
          required: false
          schema:
            type: string
            enum: ['true', 'false']
        - name: search
          in: query
          description: Case-insensitive substring match against the task text.
          required: false
          schema:
            type: string
            maxLength: 255
      responses:
        '200':
          description: A list of tasks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  count: { type: integer, example: 2 }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Task' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Tasks]
      summary: Create a new task
      description: Creates a task and returns the persisted resource.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
            example:
              text: Buy groceries
              completed: false
      responses:
        '201':
          description: The task was created.
          headers:
            Location:
              description: URL of the newly created task.
              schema: { type: string, example: /api/tasks/1 }
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Task created }
                  data: { $ref: '#/components/schemas/Task' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Numeric task identifier.
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Tasks]
      summary: Get a single task
      responses:
        '200':
          description: The requested task.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Task' }
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Tasks]
      summary: Update an existing task
      description: |
        Partial update - send only the fields you want to change.
        At least one of `text` or `completed` must be present.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
            example:
              text: Buy groceries and dog food
      responses:
        '200':
          description: The updated task.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Task updated }
                  data: { $ref: '#/components/schemas/Task' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Tasks]
      summary: Update an existing task (alias of PUT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: The updated task.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Task updated }
                  data: { $ref: '#/components/schemas/Task' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Tasks]
      summary: Delete a task
      responses:
        '204':
          description: The task was deleted. No content is returned.
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    User:
      type: object
      description: A member of the library staff. Never includes password material.
      properties:
        id: { type: integer, example: 1 }
        username: { type: string, example: priyanka }
        email: { type: string, example: p.das@rccit.edu }
        name: { type: string, example: Priyanka Das }
        role: { type: string, example: Head Librarian }
        department: { type: string, example: Central Library Services }
        initials: { type: string, example: PD }

    Task:
      type: object
      required: [id, text, completed, createdAt, updatedAt]
      properties:
        id:
          type: integer
          description: Auto-incrementing unique identifier.
          example: 1
        text:
          type: string
          description: The task description. Sanitised - HTML tags and control characters are stripped.
          minLength: 1
          maxLength: 255
          example: Buy groceries
        completed:
          type: boolean
          description: Whether the task has been completed.
          example: false
        createdAt:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-01-15T10:30:00.000Z'

    CreateTaskRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 255
          example: Buy groceries
        completed:
          type: boolean
          default: false
          example: false

    UpdateTaskRequest:
      type: object
      minProperties: 1
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 255
          example: Buy groceries and dog food
        completed:
          type: boolean
          example: true

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            message:
              type: string
              example: Validation failed
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string, example: text }
                  message: { type: string, example: Task text is required }
                  code: { type: string, example: too_small }
        requestId:
          type: string
          format: uuid
          example: 3f7a2c10-9b41-4e8a-9d55-1a2b3c4d5e6f

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: tf_session
      description: HttpOnly session cookie issued by `POST /api/auth/login`.

  responses:
    BadRequest:
      description: The payload failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            success: false
            error:
              message: Validation failed
              details:
                - field: text
                  message: Task text is required
                  code: too_small
            requestId: 3f7a2c10-9b41-4e8a-9d55-1a2b3c4d5e6f
    NotFound:
      description: No task exists with that id.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            success: false
            error:
              message: Task not found
            requestId: 3f7a2c10-9b41-4e8a-9d55-1a2b3c4d5e6f
    Unauthorized:
      description: The credentials were rejected.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            success: false
            error:
              message: Invalid username or password
            requestId: 3f7a2c10-9b41-4e8a-9d55-1a2b3c4d5e6f
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            success: false
            error:
              message: Too many requests, please try again later
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            success: false
            error:
              message: Internal Server Error
            requestId: 3f7a2c10-9b41-4e8a-9d55-1a2b3c4d5e6f
